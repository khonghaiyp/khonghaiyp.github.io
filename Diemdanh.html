<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm danh lớp thầy Khổng Văn Hải</title>
    <style>
        :root {
            --red-empty: #e74c3c;
            --blue-taken: #3498db;
            --bg-color: #f5f6fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 20px;
            color: #2c3e50;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .status-bar {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
            font-weight: bold;
            color: #27ae60;
        }
        .legend {
            display: flex; justify-content: center; gap: 20px; margin-bottom: 30px;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .box { width: 20px; height: 20px; border-radius: 4px;}
        .box.red { background-color: var(--red-empty); }
        .box.blue { background-color: var(--blue-taken); }

        /* Sơ đồ lớp học */
        .classroom {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        .day {
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            width: 320px;
        }
        .day-title { text-align: center; background: #2c3e50; color: white; padding: 8px; border-radius: 4px; margin-top: 0; }
        
        .ban {
            border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin-bottom: 12px;
            background: #fafafa;
        }
        .ban-title { font-size: 0.9em; font-weight: bold; margin-bottom: 8px; color: #555; text-align: center;}
        
        .seats {
            display: flex; justify-content: center; gap: 8px;
        }
        .seat {
            width: 45px; height: 45px;
            background-color: var(--red-empty);
            border-radius: 6px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 0.8em; font-weight: bold;
            transition: transform 0.1s;
            position: relative;
        }
        .seat:hover { transform: scale(1.1); }
        .seat.taken {
            background-color: var(--blue-taken);
            cursor: not-allowed;
            font-size: 0.7em;
            text-align: center;
            line-height: 1.2;
            padding: 2px;
        }
        .seat.taken:hover { transform: scale(1); }

        /* Modal nhập thông tin */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal {
            background: white; padding: 25px; border-radius: 10px; width: 300px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal h3 { margin-top: 0; color: #2c3e50; }
        .modal input {
            width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd;
            border-radius: 5px; box-sizing: border-box;
        }
        .modal button {
            width: 100%; padding: 10px; background: #2c3e50; color: white;
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
            margin-top: 5px;
        }
        .modal button:hover { background: #34495e; }
        .modal .btn-cancel { background: #e74c3c; margin-top: 10px;}
        .modal .btn-cancel:hover { background: #c0392b; }
        
        .loading { display: none; text-align: center; color: #e67e22; font-weight: bold; margin-bottom: 10px;}
    </style>
</head>
<body>

    <h1>ĐIỂM DANH LỚP THẦY KHỔNG VĂN HẢI</h1>
    <div id="status" class="status-bar">Đang kết nối dữ liệu...</div>

    <div class="legend">
        <div class="legend-item"><div class="box red"></div> Chưa có người ngồi</div>
        <div class="legend-item"><div class="box blue"></div> Đã có người ngồi</div>
    </div>

    <div class="loading" id="loading">Đang đồng bộ dữ liệu</div>
    <div class="classroom" id="classroom"></div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modal-title">Đăng ký ghế</h3>
            <input type="text" id="sv-id" placeholder="Mã sinh viên" required>
            <input type="text" id="sv-name" placeholder="Họ và Tên" required>
            <button onclick="submitData()">Xác nhận</button>
            <button class="btn-cancel" onclick="closeModal()">Hủy</button>
        </div>
    </div>

    <script>
        // =========================================================================
        // BƯỚC QUAN TRỌNG: Dán URL Ứng dụng Web (Google Apps Script) của bạn vào đây!
        // =========================================================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz0RYFAdjuYeVeczX8ObfTKYQAbTwDMMS5r7uuZ7ty-jhJ7quS52jBw3fv9INGGV7NnPg/exec'; 
        
        let currentSeatId = '';
        const classroomEl = document.getElementById('classroom');
        const statusEl = document.getElementById('status');

        // Hàm vẽ sơ đồ lớp
        function renderClassroom() {
            classroomEl.innerHTML = '';
            for (let day = 1; day <= 3; day++) {
                let dayHtml = `<div class="day"><h2 class="day-title">Dãy ${day}</h2>`;
                
                for (let ban = 1; ban <= 15; ban++) {
                    dayHtml += `<div class="ban"><div class="ban-title">Bàn ${ban}</div><div class="seats">`;
                    
                    for (let ghe = 1; ghe <= 5; ghe++) {
                        let seatId = `D${day}-B${ban}-G${ghe}`;
                        dayHtml += `<div class="seat" id="${seatId}" onclick="openModal('${seatId}')">${ghe}</div>`;
                    }
                    dayHtml += `</div></div>`;
                }
                dayHtml += `</div>`;
                classroomEl.innerHTML += dayHtml;
            }
        }

        // Gọi Google Sheet để lấy dữ liệu
        async function fetchInitialData() {
            if(SCRIPT_URL === 'DÁN_URL_VÀO_ĐÂY') {
                statusEl.innerHTML = "⚠️ Chưa dán SCRIPT_URL! Đang chạy ở chế độ offline (Không đồng bộ).";
                statusEl.style.color = "red";
                return;
            }
            
            try {
                document.getElementById('loading').style.display = 'block';
                statusEl.innerHTML = "Đang kết nối...";
                
                let response = await fetch(SCRIPT_URL);
                let data = await response.json();
                
                // Duyệt qua dữ liệu trả về và tô xanh các ghế đã đặt
                for (let seatId in data) {
                    let seatEl = document.getElementById(seatId);
                    if (seatEl) {
                        seatEl.className = 'seat taken';
                        seatEl.onclick = null; // Vô hiệu hóa click
                        let shortName = data[seatId].name.split(" ").pop(); // Lấy tên cuối
                        seatEl.innerHTML = shortName;
                        seatEl.title = `${data[seatId].name} (${data[seatId].studentId})`;
                    }
                }
                document.getElementById('loading').style.display = 'none';
                statusEl.innerHTML = "Đã đồng bộ ✅";
            } catch (error) {
                console.error("Lỗi khi tải dữ liệu:", error);
                statusEl.innerHTML = "Lỗi kết nối. Vui lòng kiểm tra lại đường truyền hoặc URL.";
                statusEl.style.color = "red";
                document.getElementById('loading').style.display = 'none';
            }
        }

        function openModal(seatId) {
            currentSeatId = seatId;
            document.getElementById('modal-title').innerText = `Đặt chỗ: ${seatId}`;
            document.getElementById('sv-id').value = '';
            document.getElementById('sv-name').value = '';
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('sv-id').focus();
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        async function submitData() {
            let svId = document.getElementById('sv-id').value.trim();
            let svName = document.getElementById('sv-name').value.trim();

            if (!svId || !svName) {
                alert('Vui lòng nhập đầy đủ thông tin!');
                return;
            }

            // Cập nhật giao diện HTML ngay lập tức cho mượt
            let seatEl = document.getElementById(currentSeatId);
            seatEl.className = 'seat taken';
            seatEl.onclick = null;
            let shortName = svName.split(" ").pop();
            seatEl.innerHTML = shortName;
            seatEl.title = `${svName} (${svId})`;
            
            closeModal();

            // Nếu đang chạy Local (chưa có Link) thì dừng ở đây
            if(SCRIPT_URL === 'DÁN_URL_VÀO_ĐÂY') return;

            // Đẩy dữ liệu lên Google Sheet
            try {
                document.getElementById('loading').style.display = 'block';
                statusEl.innerHTML = "Đang đẩy dữ liệu...";
                
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    // Gửi dạng text/plain để tránh lỗi chặn CORS preflight của trình duyệt
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        seatId: currentSeatId,
                        studentId: svId,
                        name: svName
                    })
                });
                
                document.getElementById('loading').style.display = 'none';
                statusEl.innerHTML = "Đã đồng bộ với Google Sheet ✅";
            } catch (error) {
                console.error("Lỗi đồng bộ lên Sheet:", error);
                alert("Lưu giao diện thành công nhưng đồng bộ lên Google Sheet bị lỗi!");
                statusEl.innerHTML = "Lỗi đồng bộ!";
                statusEl.style.color = "red";
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Khởi tạo
        renderClassroom();
        fetchInitialData();
    </script>
</body>
</html>
