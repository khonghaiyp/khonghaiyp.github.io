<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sơ đồ chỗ ngồi zigzag</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d9dde5;--empty:#eceef2;
--c1:#cfe3ff;--c1t:#12407a;--c2:#ffd9c2;--c2t:#7a3412;--c3:#d4f1d8;--c3t:#1b5a28}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1d222b;--tx:#e8ebf0;--mut:#9aa3b2;--bd:#343b48;--empty:#262c37;
--c1:#1f3c63;--c1t:#cfe3ff;--c2:#6a3a1f;--c2t:#ffd9c2;--c3:#24502d;--c3t:#d4f1d8}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1d222b;--tx:#e8ebf0;--mut:#9aa3b2;--bd:#343b48;--empty:#262c37;
--c1:#1f3c63;--c1t:#cfe3ff;--c2:#6a3a1f;--c2t:#ffd9c2;--c3:#24502d;--c3t:#d4f1d8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mut)}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px;margin-top:3px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:3px 10px;border-radius:999px;font-size:13px}
.msg{margin-top:10px;font-size:14px}.err{color:#d92d20}
.wrap{overflow:hidden;padding:8px}
.room{width:max-content;transform-origin:top left}
.board{text-align:center;background:var(--empty);border-radius:6px;padding:2px;margin-bottom:6px;font-size:12px;color:var(--mut)}
.rows{display:flex;gap:6px;align-items:flex-start}
.row,.lab{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.rh{font-weight:600;font-size:12px;height:18px;line-height:18px;text-align:center;white-space:nowrap}
.lab{width:30px}.lab .rh{color:var(--mut)}
.lab div.n{height:28px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--empty);border-radius:6px}
.tb{height:28px;padding:2px;display:flex;gap:2px}
.s{min-width:28px;padding:1px;border-radius:4px;text-align:center;background:var(--empty);color:var(--mut);display:flex;flex-direction:column;justify-content:center}
.s b{font-size:14px;line-height:1.1}.s i{font-style:normal;font-size:9px;opacity:.85;line-height:1}
.cbox{padding:8px 10px;border-radius:10px;display:grid;gap:6px}
.cbox label{color:inherit;opacity:.9}
.cbox input{background:var(--card);color:var(--tx)}
.info{display:flex;flex-direction:column;gap:6px;width:150px;margin-left:8px}
.ib{border-radius:8px;padding:6px 8px;font-size:12px;line-height:1.4;overflow-wrap:anywhere}
.ib span{opacity:.8}
.bt{padding:7px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer;font-size:14px}
body.present #inputs{display:none}
.k0{background:var(--c1);color:var(--c1t)}.k1{background:var(--c2);color:var(--c2t)}.k2{background:var(--c3);color:var(--c3t)}
</style>
</head>
<body>
<div id="inputs">
<h1>Sơ đồ chỗ ngồi đánh số zigzag</h1>
<div class="card">
  <div class="grid">
    <label>Số dãy (m)<input id="m" type="number" min="1" max="20" value="4"></label>
    <label>Số bàn mỗi dãy (n)<input id="n" type="number" min="1" max="30" value="5"></label>
    <label>Số sinh viên mỗi bàn<input id="k" type="number" min="1" max="6" value="2"></label>
    <label>Tiêu đề slide<input id="ttl" type="text" value="Sơ đồ chỗ ngồi"></label>
    <label>Số lớp (p)<select id="p"><option>1</option><option>2</option><option selected>3</option></select></label>
  </div>
  <div class="grid" id="cls" style="margin-top:10px"></div>
</div>
</div>
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
  <button class="bt" id="pb">Chế độ trình chiếu</button>
  <button class="bt" id="dl" hidden>Tải PDF (1 slide)</button>
  <div class="legend" id="legend" style="margin:0"></div>
</div>
<div class="msg" id="msg"></div>
<div class="card wrap" id="box" style="margin-top:10px"><div class="room" id="room"><div class="board">Bảng / Bục giảng</div><div class="rows" id="out"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const defs=[40,35,30];
function buildClassInputs(){
  const p=+$('p').value, g=c=>[...document.querySelectorAll(c)].map(e=>e.value);
  const on=g('.cn'), om=g('.cm'), ot=g('.ct');
  $('cls').innerHTML='';
  for(let i=0;i<p;i++){
    const box=document.createElement('div');
    box.className='cbox k'+i;
    box.innerHTML=`<b>Thông tin lớp ${i+1}</b>
      <label>Số sinh viên<input type="number" min="0" class="cn" value="${on[i]||defs[i]}"></label>
      <label>Mã lớp học<input type="text" class="cm" value="${om[i]||''}" placeholder="VD: INT1001"></label>
      <label>Lớp thi<input type="text" class="ct" value="${ot[i]||''}" placeholder="VD: Thi 01"></label>`;
    box.querySelectorAll('input').forEach(e=>e.oninput=render);
    $('cls').appendChild(box);
  }
  render();
}
function val(c,i){const e=document.querySelectorAll(c)[i];return e?e.value.trim():''}
function infoText(i,x){
  const ma=val('.cm',i),th=val('.ct',i);
  return `Lớp ${i+1}`+(ma?` · Mã: ${ma}`:'')+(th?` · Lớp thi: ${th}`:'')+` · ${x} SV`;
}
let last=null;
function infoLines(i,x){
  return [['Mã lớp',val('.cm',i)||'(chưa nhập)'],['Lớp thi',val('.ct',i)||'(chưa nhập)'],['Sĩ số',x+' SV']];
}
function infoCol(sizes){
  return `<div class="info"><div class="rh">Thông tin lớp</div>`+sizes.map((x,i)=>
    `<div class="ib k${i}">`+infoLines(i,x).map(l=>`<div><span>${l[0]}:</span> <b>${l[1]}</b></div>`).join('')+`</div>`).join('')+`</div>`;
}
function render(){
  const m=Math.max(1,+$('m').value||1), n=Math.max(1,+$('n').value||1), k=Math.max(1,+$('k').value||1);
  const sizes=[...document.querySelectorAll('.cn')].map(e=>Math.max(0,+e.value||0));
  const S=sizes.reduce((a,b)=>a+b,0), T=m*n, cap=T*k;
  const tabs=Array.from({length:T},()=>[]);
  let text='',err=false;
  // các lớp ngồi liên tiếp: hết chỗ ở bàn hiện tại mới sang bàn kế tiếp
  const c=S>T*k?k+1:k;
  if(S>T*c){
    err=true;text=`Thiếu chỗ: ${S} sinh viên, dù mỗi bàn tăng thêm 1 (tối đa ${T*(k+1)} chỗ) vẫn không đủ. Hãy tăng số dãy hoặc số bàn.`;
  }else{
    const owner=[];sizes.forEach((sz,ci)=>{for(let j=1;j<=sz;j++)owner.push([ci,j])});
    for(let i=0;i<T;i++)for(let q=0;q<c;q++)tabs[i].push(owner[i*c+q]||null);
    const used=Math.ceil(S/c);
    text=c>k?`Thiếu bàn nên mỗi bàn ngồi ${c} sinh viên (thêm 1). Dùng ${used}/${T} bàn, tổng ${S} sinh viên.`
             :`Mỗi bàn ${k} sinh viên, các lớp ngồi liên tiếp. Dùng ${used}/${T} bàn (thừa ${T-used} bàn), tổng ${S} sinh viên.`;
  }
  tabs.forEach(x=>{if(!x.length)for(let c=0;c<k;c++)x.push(null)});
  last={m,n,k,tabs,sizes,err};
  const msg=$('msg');msg.className='msg'+(err?' err':'');msg.textContent=text;
  let h='';
  for(let r=0;r<m;r++){
    const down=r%2===0;
    h+=`<div class="row"><div class="rh">Dãy ${r+1} ${down?'↓':'↑'}</div>`;
    for(let t=0;t<n;t++){
      const tab=down?t:n-1-t, idx=r*n+t, asc=((r*(n-1)+t)%2===0);
      const list=asc?tabs[idx]:[...tabs[idx]].reverse();
      const seats=list.map(o=>o?`<div class="s k${o[0]}"><b>${o[1]}</b></div>`
        :`<div class="s"><b>–</b></div>`).join('');
      h+=`<div class="tb${tabs[idx].slice(k).some(Boolean)?' ex':''}">${seats}</div>`;
    }
    h+='</div>';
  }
  $('out').innerHTML=`<div class="lab"><div class="rh">Bàn</div>${Array.from({length:n},(_,i)=>`<div class="n">${i+1}</div>`).join('')}</div>`+h+infoCol(sizes);
  document.querySelectorAll('.row').forEach((row,r)=>{
    if(r%2===1){[...row.children].slice(1).reverse().forEach(e=>row.appendChild(e));}
  });
  fit();
}
function fit(){
  const room=$('room'),box=$('box');
  room.style.transform='none';
  const w=room.offsetWidth,h=room.offsetHeight;
  let sc=(box.clientWidth-16)/w;
  if(document.body.classList.contains('present')){
    const top=box.getBoundingClientRect().top+scrollY;
    sc=Math.min(sc,(innerHeight-top-24)/h);
  }
  sc=Math.min(sc,2);
  room.style.transform=`scale(${sc})`;
  box.style.height=(h*sc+16)+'px';
}
$('pb').onclick=()=>{
  const on=document.body.classList.toggle('present');
  $('pb').textContent=on?'Thoát trình chiếu':'Chế độ trình chiếu';
  fit();
};
addEventListener('resize',fit);
let dlApi=null;
if(window.claude&&claude.use){claude.use('downloads').then(d=>{if(d){dlApi=d;$('dl').hidden=false}}).catch(()=>{})}
function drawSlide(){
  const {m,n,k,tabs,sizes}=last, W=1920,H=1080, cv=document.createElement('canvas');
  cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const fill=['#cfe3ff','#ffd9c2','#d4f1d8'], ink=['#12407a','#7a3412','#1b5a28'], F='"Segoe UI",Roboto,Arial,sans-serif';
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.fillStyle='#1d2330';x.font=`700 54px ${F}`;x.textBaseline='middle';
  x.fillText($('ttl').value||'Sơ đồ chỗ ngồi',50,56);
  const top=110, bottom=H-30, left=50, right=W-50, ip=420, gr=right-ip-20;
  x.fillStyle='#eceef2';x.fillRect(left,top,right-left,32);
  x.fillStyle='#667085';x.font=`500 22px ${F}`;x.textAlign='center';
  x.fillText('Bảng / Bục giảng',(left+right)/2,top+17);
  const gy=top+44, labw=64, rh=34, gap=5, cgap=18;
  const maxc=Math.max(k,...tabs.map(t=>t.length));
  const th=Math.min(70,(bottom-gy-rh-(n-1)*gap)/n);
  const sw=Math.min(84,((gr-left-labw-m*cgap)/m-8)/maxc-3);
  const cw=maxc*(sw+3)+8;
  const total=labw+m*(cw+cgap), ox=left+Math.max(0,(gr-left-total)/2);
  x.textAlign='center';x.font=`700 ${Math.min(30,th*.5)}px ${F}`;
  x.fillStyle='#667085';x.font=`600 24px ${F}`;x.fillText('Bàn',ox+labw/2-6,gy+rh/2);
  for(let t=0;t<n;t++){
    const ty=gy+rh+t*(th+gap);
    x.fillStyle='#eceef2';x.fillRect(ox,ty,labw-12,th);
    x.fillStyle='#1d2330';x.font=`700 ${Math.min(30,th*.55)}px ${F}`;x.fillText(t+1,ox+(labw-12)/2,ty+th/2);
  }
  for(let r=0;r<m;r++){
    const cx=ox+labw+r*(cw+cgap), down=r%2===0;
    x.fillStyle='#1d2330';x.font=`700 26px ${F}`;x.fillText(`Dãy ${r+1} ${down?'↓':'↑'}`,cx+cw/2,gy+rh/2);
    for(let t=0;t<n;t++){
      const j=down?t:n-1-t, idx=r*n+j, asc=((r*(n-1)+j)%2===0);
      const list=asc?tabs[idx]:[...tabs[idx]].reverse();
      const ty=gy+rh+t*(th+gap);
      const w0=list.length*(sw+3)-3, sx=cx+(cw-w0)/2;
      list.forEach((o,j)=>{
        const px=sx+j*(sw+3);
        x.fillStyle=o?fill[o[0]]:'#eceef2';x.fillRect(px,ty+4,sw,th-8);
        x.fillStyle=o?ink[o[0]]:'#98a2b3';x.font=`700 ${Math.min(34,th*.55)}px ${F}`;
        x.fillText(o?o[1]:'–',px+sw/2,ty+th/2+1);
      });
    }
  }
  x.textAlign='left';
  let py=gy;
  x.fillStyle='#1d2330';x.font=`700 26px ${F}`;x.fillText('Thông tin lớp',right-ip,py+rh/2);py+=rh;
  sizes.forEach((sz,i)=>{
    const ls=infoLines(i,sz), bh=ls.length*40+24;
    x.fillStyle=fill[i];x.fillRect(right-ip,py,ip,bh);
    ls.forEach((l,j)=>{
      x.fillStyle=ink[i];x.font=`500 28px ${F}`;x.fillText(l[0]+':',right-ip+16,py+32+j*40);
      const lw=x.measureText(l[0]+': ').width;
      x.font=`700 28px ${F}`;x.fillText(l[1],right-ip+16+lw,py+32+j*40,ip-32-lw);
    });
    py+=bh+14;
  });
  return cv;
}
$('dl').onclick=async()=>{
  if(!last||last.err){alert('Hãy sửa lỗi thiếu chỗ trước khi tải PDF.');return}
  const cv=drawSlide(), {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[297,167.0625]});
  pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,297,167.0625);
  try{await dlApi.save({filename:'so-do-cho-ngoi.pdf',data:pdf.output('blob')})}
  catch(e){if(e&&e.code!=='declined')alert('Không tải được PDF: '+(e.message||e))}
};
['m','n','k','ttl'].forEach(id=>$(id).oninput=render);
$('p').onchange=buildClassInputs;
buildClassInputs();
</script>
</body>
</html>
